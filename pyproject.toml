[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "what-if-fc"
version = "0.1.0"
description = "Counterfactual football intelligence: synthetic match events, the Ghost Pass, and evidence-bound AI overlays on Microsoft Fabric and Foundry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "agent-framework-foundry",
    "azure-eventhub>=5.11",
    "azure-identity>=1.17",
    "python-dotenv>=1.0",
    "azure-kusto-data>=4.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "azure-storage-blob>=12.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["core*", "simulator*", "analytics*", "agents*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
